<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0520">
<title>Connect — Francis Le Coq</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#0d0520,#1a0840);font-family:'Fredoka One',cursive;min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden;}
.card{width:100%;max-width:380px;background:linear-gradient(145deg,rgba(13,5,32,0.98),rgba(30,10,65,0.98));border:2px solid rgba(180,100,255,0.35);border-radius:24px;padding:22px 20px;box-shadow:0 0 60px rgba(120,40,200,0.4);position:relative;z-index:1;}

.back-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(109,40,217,0.2);border:1px solid rgba(168,85,247,0.4);color:#a78bfa;font-size:13px;font-family:'Fredoka One',cursive;cursor:pointer;margin-bottom:14px;padding:8px 14px;border-radius:10px;width:100%;touch-action:manipulation;transition:all 0.15s;}
.back-btn:active{opacity:0.7;transform:scale(0.97)}
.back-btn::before{content:'←';font-size:18px;font-weight:bold}

/* ── Header : drapeau · coq · drapeau ── */
.hero{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}
.flag{font-size:26px;background:rgba(168,85,247,0.1);border:2px solid transparent;border-radius:12px;padding:6px 9px;cursor:pointer;transition:all 0.15s;line-height:1;flex-shrink:0;}
.flag.sel{border-color:#FFD700;background:rgba(255,215,0,0.15);box-shadow:0 0 12px rgba(255,215,0,0.3)}
.flag:active{transform:scale(0.9)}
.flag-label{font-size:8px;text-align:center;color:#9a7bc8;margin-top:3px;letter-spacing:1px;font-family:'Bangers',cursive}

.coq-wrap{position:relative;width:54px;height:54px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;touch-action:manipulation;flex-shrink:0;overflow:visible;}
.coq-img{width:auto;height:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 90%;will-change:transform;}
@keyframes breathe{0%,100%{transform:scale(1) translateY(0) rotate(-1deg)}50%{transform:scale(1.06) translateY(-1.5px) rotate(1deg)}}
.coq-wrap.tapped .coq-img{animation:squish 0.32s ease}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(0.9,1.08)}70%{transform:scale(1.06,0.94)}100%{transform:scale(1)}}

.header h1{font-family:'Bangers',cursive;font-size:26px;color:#FFD700;letter-spacing:3px;text-shadow:0 0 20px #FFD700;text-align:center;margin-bottom:4px}
.header .sub{font-size:11px;color:#c9aaee;line-height:1.6;text-align:center;margin-bottom:16px}
.header .sub b{color:#FFD700}

/* particules tap */
.particle{position:absolute;pointer-events:none;font-size:22px;z-index:50;animation:fly 1.25s ease-out forwards;will-change:transform,opacity}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(0.5) rotate(0deg)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(var(--rot))}}

/* ── Status ── */
.status-bar{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;line-height:1.6;display:none}
.status-bar.ok{background:rgba(22,163,74,0.15);border:1.5px solid rgba(163,230,53,0.5);color:#86efac}
.status-bar.warn{background:rgba(217,119,6,0.1);border:1.5px solid rgba(217,119,6,0.4);color:#fcd34d}

/* ── Option block ── */
.opt{background:rgba(168,85,247,0.06);border:1.5px solid rgba(168,85,247,0.22);border-radius:16px;padding:14px;margin-bottom:12px;}
.opt-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.opt-num{background:linear-gradient(135deg,#6d28d9,#4c1d95);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:'Bangers',cursive;font-size:14px;color:#fff;flex-shrink:0}
.opt-title{font-family:'Bangers',cursive;font-size:14px;letter-spacing:1.5px;color:#c084fc;line-height:1.1}
.opt-desc{font-size:10.5px;color:#9a86c0;line-height:1.5;margin-bottom:10px}

.input-field{width:100%;padding:13px;background:rgba(255,255,255,0.07);border:2px solid rgba(168,85,247,0.4);border-radius:12px;color:#fff;font-size:13px;font-family:'Fredoka One',cursive;outline:none;transition:border-color 0.2s;}
.input-field:focus{border-color:rgba(168,85,247,0.9)}
.input-field::placeholder{color:rgba(255,255,255,0.25)}
.hint{font-size:9.5px;margin-top:5px;text-align:right;min-height:13px;color:#888}

.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-family:'Bangers',cursive;letter-spacing:1.5px;cursor:pointer;color:#fff;margin-top:8px;touch-action:manipulation;transition:all 0.15s;display:block}
.btn:active{transform:scale(0.97);opacity:0.85}
.btn:disabled{opacity:0.5}
.btn-ton{background:linear-gradient(135deg,#0098EA,#0077b6);box-shadow:0 4px 18px rgba(0,152,234,0.4)}
.btn-cyan{background:linear-gradient(135deg,#0ea5e9,#0284c7);box-shadow:0 4px 18px rgba(14,165,233,0.4)}
.btn-stars{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 18px rgba(245,158,11,0.45)}
.loading{color:#c9aaee;font-size:11px;margin:6px 0 0;text-align:center;min-height:15px}

.divider{display:flex;align-items:center;gap:10px;margin:4px 0 12px;color:#7c6aa0;font-size:10px;font-family:'Bangers',cursive;letter-spacing:2px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(168,85,247,0.25)}

.chain-toggle{display:flex;gap:8px;margin-bottom:8px}
.chain-opt{flex:1;text-align:center;padding:8px;border-radius:10px;border:1.5px solid rgba(168,85,247,0.3);background:rgba(255,255,255,0.04);font-size:11px;cursor:pointer;transition:all 0.15s;font-family:'Bangers',cursive;letter-spacing:1px;color:#c9aaee}
.chain-opt.sel{border-color:#FFD700;background:rgba(255,215,0,0.12);color:#FFD700}
.chain-opt:active{transform:scale(0.96)}
</style>
</head>

    <p class="sub" id="subText"></p>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <!-- OPTION 1 — TON Connect -->
  <div class="opt">
    <div class="opt-head">
      <div class="opt-num">1</div>
      <div class="opt-title" id="opt1Title">CONNECT TON WALLET</div>
    </div>
    <div class="opt-desc" id="opt1Desc"></div>
    <button class="btn btn-ton" id="tonBtn" onclick="connectTon()">💎 <span id="tonBtnTxt">Connect TON</span></button>
    <div class="loading" id="tonMsg"></div>
  </div>

  <!-- OPTION 2 — Solana manuel -->
  <div class="opt">
    <div class="opt-head">
      <div class="opt-num">2</div>
      <div class="opt-title" id="opt2Title">PASTE SOLANA ADDRESS</div>
    </div>
    <div class="opt-desc" id="opt2Desc"></div>
    <input class="input-field" id="solInput" type="text" placeholder="Paste your Solana address…"
      oninput="validateSol(this)" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <div class="hint" id="solHint"></div>
    <button class="btn btn-cyan" id="solBtn" onclick="linkSol()" disabled>◎ <span id="solBtnTxt">Link Solana</span></button>
    <div class="loading" id="solMsg"></div>
  </div>

  <!-- OPTION 3 — Stars + cashback -->
  <div class="opt">
    <div class="opt-head">
      <div class="opt-num">3</div>
      <div class="opt-title" id="opt3Title">UNLOCK WITH STARS</div>
    </div>
    <div class="opt-desc" id="opt3Desc"></div>

    <div class="chain-toggle">
      <div class="chain-opt sel" id="cbTON" onclick="setCbChain('ton')">💎 TON</div>
      <div class="chain-opt" id="cbSOL" onclick="setCbChain('sol')">◎ Solana</div>
    </div>
    <input class="input-field" id="cbInput" type="text" placeholder="Paste address for cashback…"
      oninput="validateCb(this)" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <div class="hint" id="cbHint"></div>
    <button class="btn btn-stars" id="starsBtn" onclick="buyStars()">⭐ <span id="starsBtnTxt">Unlock — 100 ⭐</span></button>
    <div class="loading" id="starsMsg"></div>
  </div>

</div>

<script>
const BACKEND  = 'https://mubqtnqulpyehkgubhnh.supabase.co/functions/v1';
const GAME_URL = 'https://franclecoq.github.io/FrancRun/';
const MINIAPP  = 'https://t.me/FrancisLeCoqBot/wallet';
const tg = window.Telegram?.WebApp;

/* ═══════════ I18N ═══════════ */
let LANG = localStorage.getItem('francCoqLang') || 'en';
const I18N = {
  en:{
    back:'Back to game',
    sub:'Hold <b>$FRANC</b> on TON or Solana — or unlock with Stars.<br>One unlock = the <b>whole henhouse</b> opens!',
    opt1Title:'CONNECT TON WALLET',
    opt1Desc:'One tap — your Telegram TON wallet links automatically. Hold $FRANC → everything unlocks.',
    opt2Title:'PASTE SOLANA ADDRESS',
    opt2Desc:'Paste your Solana address manually. Hold $FRANC → everything unlocks.',
    opt3Title:'UNLOCK WITH STARS',
    opt3Desc:'Unlock the whole universe forever for 100 ⭐ (~2.29€) — and get 50 ⭐ worth of $FRANC cashback! Address optional — you can claim it later.',
    solPlaceholder:'Paste your Solana address…',
    cbPlaceholder:'Paste address for cashback…',
    solHintDefault:'Solana address — 32 to 44 characters',
    solHintValid:'✅ Valid address',
    solHintInvalid:'❌ Invalid address',
    tonHintDefault:'TON address (UQ… or EQ…)',
    tonHintValid:'✅ Valid TON address',
    tonHintInvalid:'❌ Invalid TON address',
    tonBtn:'Connect TON', solBtn:'Link Solana', starsBtn:'Unlock — 100 ⭐',
    linking:'Checking $FRANC balance…',
    tonSoon:'TON connect — available at launch 🚀',
    starsSoon:'Stars purchase — available soon ⭐',
    detected:'detected', noFranc:'connected — no $FRANC found', linked:'linked'
  },
  fr:{
    back:'Retour au jeu',
    sub:'Détiens du <b>$FRANC</b> sur TON ou Solana — ou débloque avec des Étoiles.<br>Un seul déblocage = tout le <b>poulailler</b> s\'ouvre !',
    opt1Title:'CONNECTER WALLET TON',
    opt1Desc:'Un tap — ton wallet TON Telegram se connecte automatiquement. Détiens du $FRANC → tout se débloque.',
    opt2Title:'COLLER ADRESSE SOLANA',
    opt2Desc:'Colle ton adresse Solana manuellement. Détiens du $FRANC → tout se débloque.',
    opt3Title:'DÉBLOQUER AVEC ÉTOILES',
    opt3Desc:'Débloque tout l\'univers à vie pour 100 ⭐ (~2,29€) — et reçois 50 ⭐ d\'équivalent en $FRANC ! Adresse facultative — réclamable plus tard.',
    solPlaceholder:'Colle ton adresse Solana…',
    cbPlaceholder:'Colle l\'adresse pour le cashback…',
    solHintDefault:'Adresse Solana — 32 à 44 caractères',
    solHintValid:'✅ Adresse valide',
    solHintInvalid:'❌ Adresse invalide',
    tonHintDefault:'Adresse TON (UQ… ou EQ…)',
    tonHintValid:'✅ Adresse TON valide',
    tonHintInvalid:'❌ Adresse TON invalide',
    tonBtn:'Connecter TON', solBtn:'Lier Solana', starsBtn:'Débloquer — 100 ⭐',
    linking:'Vérification du solde $FRANC…',
    tonSoon:'Connexion TON — disponible au lancement 🚀',
    starsSoon:'Achat Étoiles — bientôt disponible ⭐',
    detected:'détecté', noFranc:'connecté — pas de $FRANC', linked:'lié'
  }
};
function t(k){return (I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:I18N.en[k];}

function applyLang(){
  document.documentElement.lang=LANG;
  document.getElementById('subText').innerHTML=t('sub');
  document.querySelector('[data-i18n="back"]').textContent=t('back');
  document.getElementById('opt1Title').textContent=t('opt1Title');
  document.getElementById('opt1Desc').textContent=t('opt1Desc');
  document.getElementById('opt2Title').textContent=t('opt2Title');
  document.getElementById('opt2Desc').textContent=t('opt2Desc');
  document.getElementById('opt3Title').textContent=t('opt3Title');
  document.getElementById('opt3Desc').textContent=t('opt3Desc');
  document.getElementById('tonBtnTxt').textContent=t('tonBtn');
  document.getElementById('solBtnTxt').textContent=t('solBtn');
  document.getElementById('starsBtnTxt').textContent=t('starsBtn');
  document.getElementById('solInput').placeholder=t('solPlaceholder');
  document.getElementById('cbInput').placeholder=t('cbPlaceholder');
  const sh=document.getElementById('solHint'); if(!sh.dataset.state) sh.textContent=t('solHintDefault');
  document.getElementById('flagFR').classList.toggle('sel',LANG==='fr');
  document.getElementById('flagEN').classList.toggle('sel',LANG==='en');
}
function setLang(l){LANG=l;localStorage.setItem('francCoqLang',l);applyLang();}

/* ═══════════ COQ TAP : cœurs / pièces ═══════════ */
const TAP_EMOJIS=['❤️','💛','🪙','🪙','💜','⭐','🐔','💎'];
function tapCoq(e){
  const wrap=document.getElementById('coqWrap');
  wrap.classList.remove('tapped');void wrap.offsetWidth;wrap.classList.add('tapped');
  try{tg?.HapticFeedback?.impactOccurred?.('light');}catch(_){}
  const rect=wrap.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  const n=5+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=TAP_EMOJIS[Math.floor(Math.random()*TAP_EMOJIS.length)];
    p.style.left=x+'px';p.style.top=y+'px';
    const ang=(-90+(Math.random()*70-35))*Math.PI/180;
    const dist=130+Math.random()*90;               // envol bien plus haut
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',(Math.sin(ang)*dist-40)+'px');
    p.style.setProperty('--rot',(Math.random()*160-80)+'deg');
    p.style.fontSize=(15+Math.random()*11)+'px';
    wrap.appendChild(p);
    setTimeout(()=>p.remove(),1250);
  }
}

/* ═══════════ STATUS (réutilise check-franc) ═══════════ */
async function checkStatus(){
  if(!tg?.initData)return;
  const bar=document.getElementById('statusBar');
  try{
    const res=await fetch(BACKEND+'/check-franc',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:tg.initData})
    });
    const d=await res.json();
    const unlocked = d.unlocked ?? (d.walletLinked && d.hasFranc);
    if(unlocked){
      const reason=d.reason||'solana';
      const sym=reason==='ton'?'💎':(reason==='stars'?'⭐':'◎');
      const bal=d.balance?Number(d.balance).toLocaleString():'';
      bar.className='status-bar ok';
      bar.innerHTML = reason==='stars'
        ? `✅ <b style="color:#a3e635">Unlocked via ⭐</b>`
        : `✅ <b style="color:#a3e635">$FRANC ${t('detected')}!</b> ${sym} · ${bal} $FRANC`;
      bar.style.display='block';
    } else if(d.walletLinked){
      bar.className='status-bar warn';
      bar.innerHTML=`⚠️ ${t('noFranc')}`;
      bar.style.display='block';
    }
  }catch(_){}
}

/* ═══════════ OPTION 2 — Solana manuel (existant) ═══════════ */
function validateSol(input){
  const val=input.value.trim();
  const valid=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(val);
  const btn=document.getElementById('solBtn');const hint=document.getElementById('solHint');
  hint.dataset.state='1';
  if(valid){input.style.borderColor='rgba(163,230,53,0.7)';hint.textContent=t('solHintValid');hint.style.color='#86efac';btn.disabled=false;}
  else{input.style.borderColor=val.length>5?'rgba(255,80,80,0.6)':'rgba(168,85,247,0.4)';hint.textContent=val.length>5?t('solHintInvalid'):t('solHintDefault');hint.style.color=val.length>5?'#fca5a5':'#888';btn.disabled=true;}
}
async function linkSol(){
  const address=(document.getElementById('solInput').value||'').trim();
  if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address))return;
  const btn=document.getElementById('solBtn');const msg=document.getElementById('solMsg');
  btn.disabled=true;btn.style.opacity='0.6';msg.textContent=t('linking');
  try{
    const res=await fetch(BACKEND+'/link-wallet',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:tg.initData,wallet:address})
    });
    const data=await res.json();
    if(data.ok){
      msg.textContent='';document.getElementById('solInput').value='';
      document.getElementById('solHint').textContent=t('solHintDefault');
      document.getElementById('solHint').style.color='#888';
      btn.disabled=true;btn.style.opacity='1';
      await checkStatus();
      if(data.hasFranc) setTimeout(goBack,1200);
    }else{
      msg.textContent='❌ '+(data.error||'Error');btn.disabled=false;btn.style.opacity='1';
    }
  }catch(_){msg.textContent='❌ Connection error';btn.disabled=false;btn.style.opacity='1';}
}

/* ═══════════ OPTION 1 — TON Connect (placeholder câblage étape suivante) ═══════════ */
function connectTon(){
  const msg=document.getElementById('tonMsg');
  msg.textContent=t('tonSoon');
  // Le câblage TON Connect réel sera branché à l'étape suivante.
}

/* ═══════════ OPTION 3 — Stars + cashback (placeholder câblage étape suivante) ═══════════ */
let cbChain='ton';
function setCbChain(c){
  cbChain=c;
  document.getElementById('cbTON').classList.toggle('sel',c==='ton');
  document.getElementById('cbSOL').classList.toggle('sel',c==='sol');
  document.getElementById('cbInput').value='';
  document.getElementById('cbHint').textContent='';
  document.getElementById('starsBtn').disabled=false;
}
function isValidTon(a){return /^(UQ|EQ)[A-Za-z0-9_-]{46}$/.test(a.trim());}
function validateCb(input){
  const val=input.value.trim();const btn=document.getElementById('starsBtn');const hint=document.getElementById('cbHint');
  // Adresse OPTIONNELLE : vide = bouton actif. Saisie invalide = bouton bloqué.
  if(val.length===0){
    hint.textContent='';
    input.style.borderColor='rgba(168,85,247,0.4)';
    btn.disabled=false;
    return;
  }
  let valid;
  if(cbChain==='ton'){valid=isValidTon(val);hint.textContent=valid?t('tonHintValid'):t('tonHintInvalid');}
  else{valid=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(val);hint.textContent=valid?t('solHintValid'):t('solHintInvalid');}
  hint.style.color=valid?'#86efac':'#fca5a5';
  input.style.borderColor=valid?'rgba(163,230,53,0.7)':'rgba(255,80,80,0.6)';
  btn.disabled=!valid;
}
function buyStars(){
  const msg=document.getElementById('starsMsg');
  const btn=document.getElementById('starsBtn');
  const addr=(document.getElementById('cbInput').value||'').trim();
  // Adresse OPTIONNELLE : si saisie, elle doit être valide ; sinon on continue sans.
  if(addr.length>0){
    const ok = cbChain==='ton' ? isValidTon(addr) : /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(addr);
    if(!ok){
      msg.textContent=LANG==='fr'?'❌ Adresse invalide (ou laisse vide).':'❌ Invalid address (or leave empty).';
      return;
    }
  }
  btn.disabled=true;btn.style.opacity='0.6';
  msg.textContent=LANG==='fr'?'Création de la facture…':'Creating invoice…';
  fetch(BACKEND+'/create-stars-invoice',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData:tg.initData,chain:cbChain,address:addr})
  }).then(r=>r.json()).then(data=>{
    if(data.ok && data.invoiceLink){
      msg.textContent='';
      btn.disabled=false;btn.style.opacity='1';
      // Ouvre la fenêtre de paiement Stars native de Telegram
      if(tg?.openInvoice){
        tg.openInvoice(data.invoiceLink, (status)=>{
          if(status==='paid'){
            msg.textContent=LANG==='fr'?'✅ Débloqué ! Cashback en route.':'✅ Unlocked! Cashback on its way.';
            checkStatus();
            setTimeout(goBack,1800);
          } else if(status==='failed'){
            msg.textContent=LANG==='fr'?'❌ Paiement échoué.':'❌ Payment failed.';
          } else if(status==='cancelled'){
            msg.textContent=LANG==='fr'?'Paiement annulé.':'Payment cancelled.';
          }
        });
      } else {
        window.open(data.invoiceLink,'_blank');
      }
    } else {
      msg.textContent='❌ '+(data.error||'Error');
      btn.disabled=false;btn.style.opacity='1';
    }
  }).catch(()=>{
    msg.textContent=LANG==='fr'?'❌ Erreur de connexion.':'❌ Connection error.';
    btn.disabled=false;btn.style.opacity='1';
  });
}

/* ═══════════ NAV ═══════════ */
function goBack(){if(tg)tg.close();else window.location.href=GAME_URL;}

/* ═══════════ INIT ═══════════ */
window.addEventListener('load',()=>{
  if(!tg?.initData){window.location.replace(MINIAPP);return;}
  tg.ready();tg.expand();
  applyLang();
  checkStatus();
});
</script>
</body>
</html>
